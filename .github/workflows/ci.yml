# Checks every pull request and every push to main.
# No database is used: the Prisma client is generated without one, the
# build does not connect, and the database tests (`npm run test:db`,
# which reset a separate disposable database) are deliberately not run here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Meets the package's Node 22 engine and Prisma 7 requirements.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci # also runs `prisma generate` (postinstall)

      - name: Typecheck
        run: npm run typecheck

      - name: Prisma schema validation
        run: npm exec prisma -- validate

      - name: Lint
        run: npm run lint

      - name: Setup and database safety tests
        run: npm run test:setup

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build
